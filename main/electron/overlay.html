<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' file: data:; connect-src 'none'; form-action 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bit</title>
  <style>
    :root{color-scheme:dark;font-family:"Segoe UI",sans-serif;color:#e8fbff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#app{width:100%;height:100%;position:relative}.orb-button{position:absolute;top:4px;right:4px;width:82px;height:82px;padding:0;border:1px solid #74edff;border-radius:50%;background:#07131be8;box-shadow:0 0 22px #58e7ff99,0 0 60px #58e7ff33;cursor:pointer}.orb-button:hover{box-shadow:0 0 30px #58e7ffff,0 0 78px #58e7ff66}.orb-button img{width:55px;height:55px;border-radius:50%;animation:float 3s ease-in-out infinite}.orb-button:after{content:"";position:absolute;inset:8px;border:1px dashed #a5f6ff99;border-radius:50%;animation:spin 8s linear infinite}.panel{position:absolute;inset:0;padding:14px;border:1px solid #49c9dc;border-radius:13px;background:linear-gradient(145deg,#071820f7,#0b1727f5);box-shadow:0 20px 60px #000c,0 0 30px #50dff844;opacity:0;pointer-events:none;transform:translateY(-8px) scale(.98);transition:opacity .16s ease,transform .16s ease}.expanded .orb-button{display:none}.expanded .panel{opacity:1;pointer-events:auto;transform:none}.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#9ceffa;font-size:11px;letter-spacing:.14em}.panel-header button{border:0;background:transparent;color:#8bb7c0;font-size:20px;cursor:pointer}.hint{margin:0 0 10px;color:#769ca5;font-size:11px;line-height:1.4}.messages{height:345px;overflow:auto;padding-right:3px}.message{padding:9px 10px;margin:0 0 8px;border-left:2px solid #4ad1e5;background:#0c2732;font-size:12px;line-height:1.4;white-space:pre-wrap}.message.user{border-left:0;border-right:2px solid #aa82ff;background:#241b3d}.message.error{color:#ffabb6;border-color:#ff6d83}.chat-form{display:flex;flex-direction:column;gap:7px;margin-top:9px}textarea,input{width:100%;resize:none;border:1px solid #285d6a;border-radius:5px;background:#061017;color:#e5fbff;padding:9px;font:inherit;font-size:12px}textarea{height:52px}.actions{display:flex;gap:6px}.actions button,.open-main{border:1px solid #55cfe5;border-radius:5px;background:#103b4a;color:#e5fbff;padding:8px 9px;cursor:pointer;font-size:10px;letter-spacing:.05em}.actions button:hover,.open-main:hover{background:#176477}.actions button:disabled{opacity:.5;cursor:wait}.vision-row{display:flex;gap:6px}.vision-row input{flex:1;padding:7px;font-size:10px}.vision-row button{white-space:nowrap}.capture-state{min-height:15px;margin:5px 0;color:#79d6df;font-size:10px}.open-main{width:100%;margin-top:8px;background:#0b1e28;border-color:#326b77}.status{margin:7px 0 0;color:#738f99;font-size:10px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-3px) scale(1.03)}}
  </style>
</head>
<body>
  <div id="app">
    <button id="orb" class="orb-button" aria-label="Abrir Bit"><img src="assets/bit-orb.png" alt="Bit"></button>
    <section class="panel" aria-label="Bit flotante">
      <header class="panel-header"><strong>BIT / QUICK CONSOLE</strong><button id="close" aria-label="Cerrar">×</button></header>
      <p class="hint">Bit está disponible sobre tus otras ventanas. Escribí una pregunta o adjuntá una captura explícita de tu pantalla.</p>
      <div id="messages" class="messages"><div class="message">Listo. ¿En qué te ayudo?</div></div>
      <form id="chat-form" class="chat-form">
        <textarea id="prompt" placeholder="Preguntale algo a Bit…" aria-label="Pregunta para Bit"></textarea>
        <div class="vision-row"><input id="vision-model" placeholder="Modelo de visión local (opcional)" aria-label="Modelo de visión local"><button id="capture" type="button">Ver pantalla</button></div>
        <p id="capture-state" class="capture-state"></p>
        <div class="actions"><button id="send" type="submit">Enviar</button><button id="stop" type="button">Interrumpir</button></div>
      </form>
      <button id="open-main" class="open-main" type="button">Abrir consola completa</button>
      <p id="status" class="status">Solo local · captura bajo demanda</p>
    </section>
  </div>
  <script>
    const $=id=>document.getElementById(id);let capturedImage="";let audioContext;let nextAudioTime=0;const addMessage=(text,kind="")=>{const node=document.createElement("div");node.className=`message ${kind}`;node.textContent=text;$('messages').append(node);$('messages').scrollTop=$('messages').scrollHeight;return node};const resize=expanded=>window.bitRuntime.setOverlayExpanded(expanded).catch(error=>{$('status').textContent=error.message});
    function openPanel(){ $('app').classList.add('expanded'); void resize(true); $('prompt').focus() }function closePanel(){ $('app').classList.remove('expanded'); void resize(false) }$('orb').addEventListener('click',openPanel);$('close').addEventListener('click',closePanel);document.addEventListener('keydown',event=>{if(event.key==='Escape')closePanel()});
    $('vision-model').value=localStorage.getItem('bit.visionModel')||'';$('capture').addEventListener('click',async()=>{const button=$('capture');button.disabled=true;$('capture-state').textContent='Ocultando Bit y capturando…';try{const result=await window.bitRuntime.captureScreen();capturedImage=result.imageDataUrl;$('capture-state').textContent=`Pantalla adjunta · ${result.width}×${result.height}`;localStorage.setItem('bit.visionModel',$('vision-model').value.trim())}catch(error){capturedImage='';$('capture-state').textContent=`No se capturó: ${error.message}`;$('capture-state').className='capture-state message error'}finally{button.disabled=false}});
    $('chat-form').addEventListener('submit',async event=>{event.preventDefault();const prompt=$('prompt').value.trim();if(!prompt)return;const model=$('vision-model').value.trim()||'qwen2.5:3b';$('prompt').value='';addMessage(prompt,'user');const pending=addMessage('Pensando…');$('send').disabled=true;try{const result=await window.bitRuntime.chat({model,message:prompt,imageDataUrl:capturedImage||undefined});pending.textContent=result.text||'El modelo no devolvió texto.';capturedImage='';$('capture-state').textContent=''}catch(error){pending.textContent=error.message;pending.classList.add('error')}finally{$('send').disabled=false;$('prompt').focus()}});$('stop').addEventListener('click',()=>{void window.bitRuntime.stopSpeaking();$('status').textContent='Interrumpido'});$('open-main').addEventListener('click',()=>{void window.bitRuntime.openMain()});
    window.bitRuntime.onVoiceAudio(chunk=>{try{audioContext??=new AudioContext();const bytes=Uint8Array.from(atob(chunk.pcmBase64),char=>char.charCodeAt(0));const samples=new Int16Array(bytes.buffer);const buffer=audioContext.createBuffer(chunk.channels,samples.length/chunk.channels,chunk.sampleRate);for(let channel=0;channel<chunk.channels;channel++){const output=buffer.getChannelData(channel);for(let i=0;i<output.length;i++)output[i]=samples[i*chunk.channels+channel]/32768}const source=audioContext.createBufferSource();source.buffer=buffer;source.connect(audioContext.destination);nextAudioTime=Math.max(nextAudioTime,audioContext.currentTime);source.start(nextAudioTime);nextAudioTime+=buffer.duration}catch(error){$('status').textContent=`Audio no disponible: ${error.message}`}});
  </script>
</body>
</html>
