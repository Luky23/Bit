<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Bit · Proyecto</title>
<style>
:root{color-scheme:dark;font-family:'Segoe UI',sans-serif;color:#cee9ed;background:#071017}*{box-sizing:border-box}body{margin:0;padding:24px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #26434e;padding-bottom:18px}h1{font-size:20px;margin:0;flex:1}button,select{font:inherit;color:inherit;background:#102630;border:1px solid #315461;border-radius:8px;padding:8px}main{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,2fr);gap:20px}section{min-width:0;padding:18px;border:1px solid #26434e;border-radius:12px;background:#0b1b24;margin-top:20px}h2{font-size:15px;color:#68dfef}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:55vh;overflow:auto;font:13px Consolas,monospace}#files{max-height:65vh;overflow:auto;display:grid;gap:5px}#files button{text-align:left;overflow-wrap:anywhere}details{padding:10px 0;border-bottom:1px solid #213943}summary{cursor:pointer;overflow-wrap:anywhere}.versions{display:grid;grid-template-columns:1fr 1fr;gap:12px}#notice{color:#b8c9cf}body[data-role=info] main{grid-template-columns:1fr}body[data-role=info] #browser{display:none}#activity{max-height:70vh;overflow:auto}@media(max-width:700px){main,.versions{grid-template-columns:1fr}}
</style></head><body>
<header><h1 id="title">Proyecto</h1><label>Proyecto <select id="projects" aria-label="Proyecto"><option value="">Seguir proyecto activo</option></select></label><button id="refresh">Actualizar</button><button id="settings">Abrir principal / Ajustes</button></header>
<p id="notice" role="status"></p>
<main><section id="browser"><h2>Archivos del proyecto</h2><div id="files"></div></section><div><section id="preview"><h2 id="file-name">Contenido del archivo</h2><pre id="content">Seleccione un archivo para leerlo.</pre></section><section><h2>Trabajo actual y cambios de esta sesión</h2><p>Actualización al realizar operaciones en Bit. Las vistas previas de cambios muestran hasta 8.000 caracteres.</p><div id="activity"></div></section></div></main>
<script src="display-panel.js"></script></body></html>
